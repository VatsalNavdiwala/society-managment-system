name: society_staff_app
description: "Enterprise Society Staff Management System for Android & iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management (MVVM Architecture)
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  
  # UI & Design System
  google_fonts: ^6.1.0
  remixicon: ^1.0.0
  glassmorphism: ^3.0.0
  fl_chart: ^0.66.0
  flutter_spinkit: ^5.2.0

  # AI Face Biometrics & Geofence (Android & iOS)
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.10.0
  geolocator: ^10.1.0
  
  # Assets & PDF Slips
  mobile_scanner: ^3.5.5
  pdf: ^3.10.7
  printing: ^5.11.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
